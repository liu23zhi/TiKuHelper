name: 持续集成

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go 后端检查
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 配置 Go 环境
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 检查变更 Go 文件的格式
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          elif [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            base="$BEFORE_SHA"
          else
            base="origin/$DEFAULT_BRANCH"
          fi

          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "::error::找不到格式检查的基准提交：$base"
            exit 1
          fi

          mapfile -t files < <(git diff --diff-filter=ACMRT --name-only "$base" "$SHA" -- '*.go')
          if ((${#files[@]} == 0)); then
            echo "本次变更没有 Go 文件。"
            exit 0
          fi

          mapfile -t unformatted < <(gofmt -l "${files[@]}")
          if ((${#unformatted[@]} > 0)); then
            printf '以下 Go 文件未通过 gofmt：\n%s\n' "${unformatted[@]}"
            exit 1
          fi

      - name: 构建后端
        run: go build ./...

      - name: 生成 Linux 后端程序
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -o dist/tiku-adapter ./cmd/adapter-service

      - name: 上传后端构建产物
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: 后端构建产物-${{ github.sha }}
          path: dist/tiku-adapter
          if-no-files-found: error
          retention-days: 14

      - name: 执行 Go 静态检查
        run: go vet ./...

      - name: 运行本地包测试
        shell: bash
        run: |
          set -euo pipefail
          # 真实服务测试显式 opt-in；同名题库回归已经改用本地传输 fixture，
          # 保留它们，并串行包执行以避免短时的 SQLite 文件同步争用。
          #
          # 同时产出覆盖率：-covermode=atomic 因为后面没有并发写 profile 的需求，
          # 但 atomic 是唯一能安全合并多包 profile 的模式；测试输出 tee 到文件，
          # 供下一步区分「[no test files]」/「[no statements]」/「测试二进制异常退出」。
          # 注意：覆盖率是**产物**，不是判定条件 —— 这一步的成败仍然只由 go test 决定。
          go test -short -p 1 ./... -count=1 \
            -covermode=atomic -coverprofile=coverage.out 2>&1 | tee coverage-test.log

      - name: 汇总 Go 覆盖率（只上报，不阻断）
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          # 口径：只统计真正链接进 cmd/adapter-service 的包（go list -deps），按语句加权。
          # 与 PLUS 侧 scripts/ci/check-coverage.mjs 对齐：那边只统计真正进构建产物的 .ts，
          # 不统计跑在 dist 里、Node 加载器看不到的 src/projects/**。
          #
          # 本轮刻意**不阻断**：TIKU 现有已知基线红（internal/api、internal/controller 的
          # TestB01*/TestD03*、internal/registry 的 TestD02BillingIndexApprovedStartupPolicy
          # 单条 428 秒与 TestStrictConfig*）。阈值一上来就盯总数会天天红，红久了就没人看。
          # 基线稳定之后再给下面这条命令加 --strict（脚本已实现，退出码 1）。
          if [[ ! -f coverage.out ]]; then
            echo "::warning::coverage.out 未生成（测试步骤可能提前失败），跳过覆盖率汇总。"
            exit 0
          fi
          python3 -B scripts/ci/coverage-report.py coverage.out \
            --test-log coverage-test.log \
            --baseline scripts/ci/coverage-baseline.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: 上传覆盖率产物
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Go覆盖率-${{ github.sha }}
          path: |
            coverage.out
            coverage-test.log
          if-no-files-found: warn
          retention-days: 14

  python:
    name: Python 工具测试
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 配置 Python 环境
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: 测试 SQLite 到 MySQL 迁移工具
        run: python -m unittest discover -s tools -p 'test_*.py' -v

      # tools/userexam-crypto 的目录名带连字符，不是合法的模块名，也没有
      # __init__.py，所以 `unittest discover -s tools` 从不递归进去 ——
      # 上面那一步从来没跑过它的任何一条用例。这里显式进入目录执行。
      #
      # CI 是 ubuntu-24.04 + CPython 3.13，apsw-sqlite3mc 提供
      # cp313-manylinux_2_28_x86_64 的 wheel，所以真能把 SQLite3MC 装上、
      # 让加解密往返真跑（不是 skip）。
      - name: 安装 SQLite3MC 运行库（考试客户端 DB 工具）
        working-directory: tools/userexam-crypto
        run: python -m pip install --quiet --target ./_vendor apsw-sqlite3mc==3.54.0.0

      - name: 测试考试客户端 DB 脱机工具（含加解密往返）
        working-directory: tools/userexam-crypto
        env:
          # 缺 _vendor 时直接失败而不是 skip：本工具的核心能力就是加解密，
          # 允许它静默跳过等于这条 CI 恒绿而无意义。
          USEREXAM_REQUIRE_CRYPTO: '1'
        run: python -m unittest test_userexam_crypto -v

  release-build:
    name: 跨平台发布构建（${{ matrix.goos }}/${{ matrix.goarch }}）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: '386'
          - goos: linux
            goarch: arm
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 配置 Go 环境
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 编译发布目标
        env:
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/tiku-adapter-${TARGET_OS}-${TARGET_ARCH}"
          if [[ "$TARGET_OS" == "windows" ]]; then
            output+=".exe"
          fi
          CGO_ENABLED=0 GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" \
            go build -o "$output" ./cmd/adapter-service

  frontend:
    name: Vue 前端检查
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v7
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装锁定版本的前端依赖
        run: npm ci

      - name: 运行前端与仓库脚本测试
        run: node --test "src/utils/*.test.mjs" "../test/*.test.mjs"

      - name: 检查全部 Vue 单文件组件
        run: node scripts/check-sfc.cjs

      - name: 执行前端代码规范检查
        run: npm run lint -- --no-fix

      - name: 构建生产环境前端
        run: npm run build

      - name: 上传前端构建产物
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: 前端构建产物-${{ github.sha }}
          path: web/dist
          if-no-files-found: error
          retention-days: 14

  docker:
    name: Docker 镜像构建
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 构建并载入 Docker 镜像（不推送）
        id: build
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: tiku-adapter:ci-${{ github.sha }}
          provenance: false
          sbom: false

      - name: 导出 Docker 镜像归档
        run: docker save -o "$RUNNER_TEMP/tiku-adapter-ci.tar" "tiku-adapter:ci-${GITHUB_SHA}"

      - name: 上传 Docker 镜像归档
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: Docker 镜像构建产物-${{ github.sha }}
          path: ${{ runner.temp }}/tiku-adapter-ci.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: 输出 Docker 镜像构建摘要
        if: always()
        shell: bash
        env:
          BUILD_STATUS: ${{ job.status }}
          IMAGE_TAG: tiku-adapter:ci-${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$BUILD_STATUS" in
            success) BUILD_RESULT="成功" ;;
            failure) BUILD_RESULT="失败" ;;
            cancelled) BUILD_RESULT="已取消" ;;
            *) BUILD_RESULT="未执行" ;;
          esac

          {
            echo '## Docker 镜像构建摘要'
            echo
            echo '| 项目 | 内容 |'
            echo '| --- | --- |'
            printf '| 构建结果 | %s |\n' "$BUILD_RESULT"
            printf '| 镜像标签 | `%s` |\n' "$IMAGE_TAG"
            printf '| 镜像摘要 | `%s` |\n' "${IMAGE_DIGEST:-未生成}"
            printf '| 镜像 ID | `%s` |\n' "${IMAGE_ID:-未生成}"
            printf '| 代码提交 | `%s` |\n' "$COMMIT_SHA"
            echo
            if [[ -n "$ARTIFACT_URL" ]]; then
              printf '[下载 Docker 镜像归档](%s)（下载后可使用 docker load 导入）\n' "$ARTIFACT_URL"
            else
              echo 'Docker 镜像归档未生成或上传失败。'
            fi
            echo
            printf '[查看完整运行日志](%s)\n' "$RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"

  # build-exe.ps1 的 Python 探测回归保护。
  #
  # 为什么必须是 Windows：那个 bug 只存在于 **Windows PowerShell 5.1** 的双引号
  # 插值语义里（`-c "... struct.calcsize(""P"") ..."` 被 PowerShell 吃掉引号，
  # 下发给 Python 的代码变成 NameError: name 'P' is not defined）。pwsh 7 恰好
  # 容忍那种写法，所以在 ubuntu 或 pwsh 下跑这条测试会在坏代码上保持绿色，
  # 等于没测。只有 windows-latest 才有 powershell.exe 5.1。
  #
  # 成本：runner 自带 Windows PowerShell 5.1，不需要额外装；只需要装 CPython
  # 3.11（脚本硬要求 3.11 x64）—— setup-python 有缓存，约 10s。不装 PyInstaller，
  # 不构建 exe（那条路径要 ~20s + vendored 原生扩展，不是本 job 要守的东西）。
  probe-windows:
    name: build-exe.ps1 探测回归（PowerShell 5.1）
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 配置 Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          # 脚本用 `py -3.11` 调用，Windows runner 需要 py 启动器。
          # setup-python 在 Windows 上会同时装好 py launcher。
          architecture: 'x64'

      - name: 确认 powershell.exe 是 5.1
        shell: pwsh
        run: |
          $exe = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          if (-not (Test-Path $exe)) { throw "powershell.exe 不存在：$exe" }
          $ver = & $exe -NoProfile -Command '$PSVersionTable.PSVersion.Major'
          Write-Host "powershell.exe major = $ver"
          if ($ver -ne 5) { throw "期望 Windows PowerShell 5.x，实际 $ver；本测试的前提不成立" }

      - name: 确认 py -3.11 可用
        working-directory: tools/userexam-crypto
        shell: pwsh
        run: |
          py -3.11 -c "import sys; print(sys.version)"
          if ($LASTEXITCODE -ne 0) { throw "py -3.11 不可用" }

      - name: build-exe.ps1 -ProbeOnly 冒烟（PowerShell 5.1）
        working-directory: tools/userexam-crypto
        shell: pwsh
        run: |
          $exe = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          & $exe -NoProfile -ExecutionPolicy Bypass -File .\build-exe.ps1 -ProbeOnly -ProbeMachineReadable
          if ($LASTEXITCODE -ne 0) { throw "build-exe.ps1 -ProbeOnly 在 PowerShell 5.1 下失败（exit $LASTEXITCODE）" }

      - name: 测试 build-exe.ps1 探测回归
        working-directory: tools/userexam-crypto
        shell: pwsh
        run: |
          py -3.11 -m unittest test_build_exe -v
          if ($LASTEXITCODE -ne 0) { throw "test_build_exe 失败" }

  summary:
    name: 持续集成摘要
    runs-on: ubuntu-24.04
    needs: [backend, frontend, docker, python, release-build, probe-windows]
    if: always()
    steps:
      - name: 输出构建结果与产物链接
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          PROBE_WINDOWS_RESULT: ${{ needs.probe-windows.result }}
          RELEASE_BUILD_RESULT: ${{ needs.release-build.result }}
          BACKEND_ARTIFACT_URL: ${{ needs.backend.outputs.artifact-url }}
          FRONTEND_ARTIFACT_URL: ${{ needs.frontend.outputs.artifact-url }}
          DOCKER_ARTIFACT_URL: ${{ needs.docker.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          {
            result_label() {
              case "$1" in
                success) echo "成功" ;;
                failure) echo "失败" ;;
                cancelled) echo "已取消" ;;
                skipped) echo "已跳过" ;;
                *) echo "未执行" ;;
              esac
            }

            echo '# 持续集成结果'
            echo
            echo '| 检查项目 | 结果 |'
            echo '| --- | --- |'
            printf '| Go 后端检查 | %s |\n' "$(result_label "$BACKEND_RESULT")"
            printf '| Python 工具测试 | %s |\n' "$(result_label "$PYTHON_RESULT")"
            printf '| build-exe.ps1 探测回归（PowerShell 5.1） | %s |\n' "$(result_label "$PROBE_WINDOWS_RESULT")"
            printf '| 跨平台发布构建 | %s |\n' "$(result_label "$RELEASE_BUILD_RESULT")"
            printf '| Vue 前端检查 | %s |\n' "$(result_label "$FRONTEND_RESULT")"
            printf '| Docker 镜像构建 | %s |\n' "$(result_label "$DOCKER_RESULT")"
            echo
            echo '## 构建产物'
            echo
            if [[ -n "$BACKEND_ARTIFACT_URL" ]]; then
              printf -- '- [下载后端构建产物](%s)\n' "$BACKEND_ARTIFACT_URL"
            else
              echo '- 后端构建产物未生成或上传失败。'
            fi
            if [[ -n "$FRONTEND_ARTIFACT_URL" ]]; then
              printf -- '- [下载前端构建产物](%s)\n' "$FRONTEND_ARTIFACT_URL"
            else
              echo '- 前端构建产物未生成或上传失败。'
            fi
            if [[ -n "$DOCKER_ARTIFACT_URL" ]]; then
              printf -- '- [下载 Docker 镜像归档](%s)（下载后可使用 docker load 导入）\n' "$DOCKER_ARTIFACT_URL"
            else
              echo '- Docker 镜像归档未生成或上传失败。'
            fi
            echo
            printf '[查看完整运行日志](%s)\n' "$RUN_URL"
            printf '\n代码提交：`%s`\n' "$COMMIT_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
