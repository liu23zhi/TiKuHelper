name: 持续集成

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go 后端检查
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 配置 Go 环境
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 检查变更 Go 文件的格式
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          elif [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            base="$BEFORE_SHA"
          else
            base="origin/$DEFAULT_BRANCH"
          fi

          # base 不可达 ≠ 代码有问题。force-push / 历史重写（filter-repo）之后，
          # `github.event.before` 指向的那些提交在远端已经不存在了，此时按不可达
          # 判红等于让「历史被重写」永久毒化这条作业：每一次 push 都红，且红的原因
          # 与本次改动无关（实测 run 43408442506 就是这样红的）。
          # 所以不可达时退化为与默认分支比较，并留一条 ::warning 保留可诊断性。
          # 只有**退化目标本身也不可达**才是真错误（fetch 不完整 / 分支名写错）。
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            fallback="origin/$DEFAULT_BRANCH"
            echo "::warning::找不到格式检查的基准提交：$base（可能已被历史重写淘汰），退化到 $fallback 比较"
            base="$fallback"
            if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              echo "::error::退化的基准提交也不可达：$base（检查 checkout 的 fetch-depth 与默认分支名）"
              exit 1
            fi
          fi

          mapfile -t files < <(git diff --diff-filter=ACMRT --name-only "$base" "$SHA" -- '*.go')
          if ((${#files[@]} == 0)); then
            echo "本次变更没有 Go 文件。"
            exit 0
          fi

          mapfile -t unformatted < <(gofmt -l "${files[@]}")
          if ((${#unformatted[@]} > 0)); then
            printf '以下 Go 文件未通过 gofmt：\n%s\n' "${unformatted[@]}"
            exit 1
          fi

      - name: 构建后端
        run: go build ./...

      - name: 生成 Linux 后端程序
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -o dist/tiku-adapter ./cmd/adapter-service

      - name: 上传后端构建产物
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: 后端构建产物-${{ github.sha }}
          path: dist/tiku-adapter
          if-no-files-found: error
          retention-days: 14

      - name: 执行 Go 静态检查
        run: go vet ./...

      - name: 运行本地包测试
        shell: bash
        run: |
          set -euo pipefail
          # 真实服务测试显式 opt-in；同名题库回归已经改用本地传输 fixture，
          # 保留它们，并串行包执行以避免短时的 SQLite 文件同步争用。
          #
          # 同时产出覆盖率：-covermode=atomic 因为后面没有并发写 profile 的需求，
          # 但 atomic 是唯一能安全合并多包 profile 的模式；测试输出 tee 到文件，
          # 供下一步区分「[no test files]」/「[no statements]」/「测试二进制异常退出」。
          # 注意：覆盖率是**产物**，不是判定条件 —— 这一步的成败仍然只由 go test 决定。
          go test -short -p 1 ./... -count=1 \
            -covermode=atomic -coverprofile=coverage.out 2>&1 | tee coverage-test.log

      - name: 汇总 Go 覆盖率（只上报，不阻断）
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          # 口径：只统计真正链接进 cmd/adapter-service 的包（go list -deps），按语句加权。
          # 与 PLUS 侧 scripts/ci/check-coverage.mjs 对齐：那边只统计真正进构建产物的 .ts，
          # 不统计跑在 dist 里、Node 加载器看不到的 src/projects/**。
          #
          # 本轮刻意**不阻断**：TIKU 现有已知基线红（internal/api、internal/controller 的
          # TestB01*/TestD03*、internal/registry 的 TestD02BillingIndexApprovedStartupPolicy
          # 单条 428 秒与 TestStrictConfig*）。阈值一上来就盯总数会天天红，红久了就没人看。
          # 基线稳定之后再给下面这条命令加 --strict（脚本已实现，退出码 1）。
          if [[ ! -f coverage.out ]]; then
            echo "::warning::coverage.out 未生成（测试步骤可能提前失败），跳过覆盖率汇总。"
            exit 0
          fi
          python3 -B scripts/ci/coverage-report.py coverage.out \
            --test-log coverage-test.log \
            --baseline scripts/ci/coverage-baseline.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: 上传覆盖率产物
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Go覆盖率-${{ github.sha }}
          path: |
            coverage.out
            coverage-test.log
          if-no-files-found: warn
          retention-days: 14

  python:
    name: Python 工具测试
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 配置 Python 环境
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: 测试 SQLite 到 MySQL 迁移工具
        run: python -m unittest discover -s tools -p 'test_*.py' -v

      # tools/userexam-crypto 的目录名带连字符，不是合法的模块名，也没有
      # __init__.py，所以 `unittest discover -s tools` 从不递归进去 ——
      # 上面那一步从来没跑过它的任何一条用例。这里显式进入目录执行。
      #
      # CI 是 ubuntu-24.04 + CPython 3.13，apsw-sqlite3mc 提供
      # cp313-manylinux_2_28_x86_64 的 wheel，所以真能把 SQLite3MC 装上、
      # 让加解密往返真跑（不是 skip）。
      - name: 安装 SQLite3MC 运行库（考试客户端 DB 工具）
        working-directory: tools/userexam-crypto
        run: python -m pip install --quiet --target ./_vendor apsw-sqlite3mc==3.54.0.0

      - name: 测试考试客户端 DB 脱机工具（含加解密往返）
        working-directory: tools/userexam-crypto
        env:
          # 缺 _vendor 时直接失败而不是 skip：本工具的核心能力就是加解密，
          # 允许它静默跳过等于这条 CI 恒绿而无意义。
          USEREXAM_REQUIRE_CRYPTO: '1'
        run: python -m unittest test_userexam_crypto -v

  release-build:
    name: 跨平台发布构建（${{ matrix.goos }}/${{ matrix.goarch }}）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: '386'
          - goos: linux
            goarch: arm
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 配置 Go 环境
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 编译发布目标
        env:
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/tiku-adapter-${TARGET_OS}-${TARGET_ARCH}"
          if [[ "$TARGET_OS" == "windows" ]]; then
            output+=".exe"
          fi
          CGO_ENABLED=0 GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" \
            go build -o "$output" ./cmd/adapter-service

  frontend:
    name: Vue 前端检查
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v7
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装锁定版本的前端依赖
        run: npm ci

      - name: 运行前端与仓库脚本测试
        run: node --test "src/utils/*.test.mjs" "../test/*.test.mjs"

      - name: 检查全部 Vue 单文件组件
        run: node scripts/check-sfc.cjs

      - name: 执行前端代码规范检查
        run: npm run lint -- --no-fix

      - name: 构建生产环境前端
        run: npm run build

      - name: 上传前端构建产物
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: 前端构建产物-${{ github.sha }}
          path: web/dist
          if-no-files-found: error
          retention-days: 14

  docker:
    name: Docker 镜像构建
    runs-on: ubuntu-24.04
    needs: [probe-windows]
    timeout-minutes: 30
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 下载 probe-windows 构建好的 exe 并放到 Dockerfile 期望的位置。
      #
      # 不下载的后果：Dockerfile 的 WITH_USEREXAM_TOOL=1 分支会因缺文件 exit 1，
      # 而这不是代码问题 —— 是「CI 拿不到 gitignore 的二进制」这个结构性事实。
      # 所以正确做法是在 CI 里真把它造出来，而不是放宽 Dockerfile 的门槛。
      - name: 下载并放置 userexam-crypto.exe
        uses: actions/download-artifact@v7
        with:
          name: userexam-crypto-exe-${{ github.sha }}
          path: tools/userexam-crypto/dist

      - name: 校验 exe 已就位（缺了要立刻红在这里，而不是等 docker build 报错）
        shell: bash
        run: |
          set -euo pipefail
          f=tools/userexam-crypto/dist/userexam-crypto.exe
          if [[ ! -s "$f" ]]; then
            echo "::error title=缺产物::probe-windows 没有产出 $f。docker build 会因此失败。"
            exit 1
          fi
          size=$(stat -c%s "$f")
          echo "userexam-crypto.exe = $size bytes"
          if [[ $size -lt 5000000 ]]; then
            echo "::error title=产物异常::exe 仅 $size 字节，疑似不是单文件打包。"
            exit 1
          fi
          head -c 2 "$f" | xxd | grep -q "4d5a" || head -c 2 "$f" | od -An -tx1 | grep -qi "4d 5a" \
            || { echo "::error title=产物异常::不是 PE 文件（期望 MZ 头）"; exit 1; }


      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 构建并载入 Docker 镜像（不推送）
        id: build
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: tiku-adapter:ci-${{ github.sha }}
          provenance: false
          sbom: false

      - name: 导出 Docker 镜像归档
        run: docker save -o "$RUNNER_TEMP/tiku-adapter-ci.tar" "tiku-adapter:ci-${GITHUB_SHA}"

      - name: 上传 Docker 镜像归档
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: Docker 镜像构建产物-${{ github.sha }}
          path: ${{ runner.temp }}/tiku-adapter-ci.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: 输出 Docker 镜像构建摘要
        if: always()
        shell: bash
        env:
          BUILD_STATUS: ${{ job.status }}
          IMAGE_TAG: tiku-adapter:ci-${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$BUILD_STATUS" in
            success) BUILD_RESULT="成功" ;;
            failure) BUILD_RESULT="失败" ;;
            cancelled) BUILD_RESULT="已取消" ;;
            *) BUILD_RESULT="未执行" ;;
          esac

          {
            echo '## Docker 镜像构建摘要'
            echo
            echo '| 项目 | 内容 |'
            echo '| --- | --- |'
            printf '| 构建结果 | %s |\n' "$BUILD_RESULT"
            printf '| 镜像标签 | `%s` |\n' "$IMAGE_TAG"
            printf '| 镜像摘要 | `%s` |\n' "${IMAGE_DIGEST:-未生成}"
            printf '| 镜像 ID | `%s` |\n' "${IMAGE_ID:-未生成}"
            printf '| 代码提交 | `%s` |\n' "$COMMIT_SHA"
            echo
            if [[ -n "$ARTIFACT_URL" ]]; then
              printf '[下载 Docker 镜像归档](%s)（下载后可使用 docker load 导入）\n' "$ARTIFACT_URL"
            else
              echo 'Docker 镜像归档未生成或上传失败。'
            fi
            echo
            printf '[查看完整运行日志](%s)\n' "$RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"

  # build-exe.ps1 的 Python 探测回归保护。
  #
  # 为什么必须是 Windows：那个 bug 只存在于 **Windows PowerShell 5.1** 的双引号
  # 插值语义里（`-c "... struct.calcsize(""P"") ..."` 被 PowerShell 吃掉引号，
  # 下发给 Python 的代码变成 NameError: name 'P' is not defined）。pwsh 7 恰好
  # 容忍那种写法，所以在 ubuntu 或 pwsh 下跑这条测试会在坏代码上保持绿色，
  # 等于没测。只有 windows-latest 才有 powershell.exe 5.1。
  #
  # 成本：runner 自带 Windows PowerShell 5.1，不需要额外装；只需要装 CPython
  # 3.11（脚本硬要求 3.11 x64）—— setup-python 有缓存，约 10s。不装 PyInstaller，
  # 不构建 exe（那条路径要 ~20s + vendored 原生扩展，不是本 job 要守的东西）。
  probe-windows:
    name: build-exe.ps1 探测回归（PowerShell 5.1）
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 配置 Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          # 脚本用 `py -3.11` 调用，Windows runner 需要 py 启动器。
          # setup-python 在 Windows 上会同时装好 py launcher。
          architecture: 'x64'

      - name: 确认 py 启动器可用（脚本硬编码调用 py -3.11）
        shell: pwsh
        run: |
          # 脚本第 43-44 行硬编码 `$python = 'py'; $pythonArgs = @('-3.11')`。
          # setup-python 不保证在 Windows 上放 py.exe；没有它，本 job 会因为
          # 环境缺失而红，看起来却像「代码回归」——那是最误导的一种失败。
          # 所以这里先单独探测，把环境问题和代码问题分开报。
          $py = Get-Command py -ErrorAction SilentlyContinue
          if (-not $py) {
            Write-Host "::error title=环境缺失::runner 上没有 py 启动器。本 job 无法验证脚本（脚本第 43 行硬编码 py -3.11）。这不是代码回归。"
            exit 1
          }
          py -0p
          py -3.11 -c "import sys, struct; print('probe-python', sys.version.split()[0], struct.calcsize('P') * 8)"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error title=环境缺失::py -3.11 不可用。这不是代码回归，请检查 setup-python 的架构/版本。"
            exit 1
          }

      - name: 确认 powershell.exe 是 5.1
        shell: pwsh
        run: |
          $exe = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          if (-not (Test-Path $exe)) { throw "powershell.exe 不存在：$exe" }
          $ver = & $exe -NoProfile -Command '$PSVersionTable.PSVersion.Major'
          Write-Host "powershell.exe major = $ver"
          if ($ver -ne 5) { throw "期望 Windows PowerShell 5.x，实际 $ver；本测试的前提不成立" }

      - name: build-exe.ps1 -ProbeOnly 冒烟（PowerShell 5.1）
        working-directory: tools/userexam-crypto
        shell: pwsh
        run: |
          $exe = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          & $exe -NoProfile -ExecutionPolicy Bypass -File .\build-exe.ps1 -ProbeOnly -ProbeMachineReadable
          if ($LASTEXITCODE -ne 0) { throw "build-exe.ps1 -ProbeOnly 在 PowerShell 5.1 下失败（exit $LASTEXITCODE）" }

      - name: 测试 build-exe.ps1 探测回归
        working-directory: tools/userexam-crypto
        shell: pwsh
        run: |
          py -3.11 -m unittest test_build_exe -v
          if ($LASTEXITCODE -ne 0) { throw "test_build_exe 失败" }

      # 真正构建 exe 并上传，供 docker 作业内嵌。
      #
      # 为什么必须在 CI 里造：exe 由 PyInstaller 在 Windows 上打包（要求 64 位
      # CPython 3.11 + PyInstaller 6.x + apsw 原生扩展），Linux runner 造不出来；
      # 而 tools/userexam-crypto/dist/* 被 .gitignore 排除，checkout 后必然不存在。
      # 之前 docker 作业因此在「缺 exe」上永久红 —— 假红比跳过更糟。
      # 一条命令完成全部：Python 探测 → PyInstaller 安装 → apsw 安装 → 打包 → 双运行时自检。
      #
      # ⚠️ 不要在 CI 里预先 pip install apsw 或 pyinstaller：
      # build-exe.ps1 内部已经做了这两件事（L112 装 apsw 到 _vendor、L101 装 pyinstaller），
      # 而且它是用 `py -3.11 -m pip` 装的 —— 与 setup-python 装到哪个解释器无关。
      # 我第一版在 CI 里预装，结果脚本第 122 行 `-m PyInstaller` 找不到包而失败：
      # 预装的进了 setup-python 的环境，脚本调的是 py launcher 的 3.11，两者不是同一个 site-packages。
      #
      # 必须用 powershell.exe 5.1（不是 pwsh）：脚本 NOTES 说明 pwsh 7 会掩盖 -c 引号缺陷，
      # 导致「探测通过但其实是坏的」这种假绿。
      - name: 构建单文件 userexam-crypto.exe（脚本内含全部依赖安装）
        working-directory: tools/userexam-crypto
        shell: pwsh
        timeout-minutes: 25
        run: |
          $exe = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          & $exe -NoProfile -ExecutionPolicy Bypass -File .\build-exe.ps1
          if ($LASTEXITCODE -ne 0) { throw "build-exe.ps1 失败（exit $LASTEXITCODE）" }
          $out = ".\dist\userexam-crypto.exe"
          if (-not (Test-Path $out)) { throw "构建产物不存在：$out" }
          $size = (Get-Item $out).Length
          Write-Host "userexam-crypto.exe = $size bytes"
          # 15 MB 量级的单文件；明显偏小说明降级成了文件夹式构建（脚本 L129 也会查，这里双保险）。
          if ($size -lt 5MB) { throw "产物仅 $size 字节，疑似不是单文件打包" }
          $head = [System.IO.File]::ReadAllBytes($out)[0..1]
          if ($head[0] -ne 0x4D -or $head[1] -ne 0x5A) { throw "产物不是 PE 文件（期望 MZ 头）" }

      - name: 上传 userexam-crypto.exe 供 docker 作业使用
        uses: actions/upload-artifact@v7
        with:
          name: userexam-crypto-exe-${{ github.sha }}
          path: tools/userexam-crypto/dist/userexam-crypto.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  # SQLite → MariaDB 迁移链路与「真实数据库」迁移测试。
  #
  # 为什么需要这个作业（task_doc/121 决策 10 + 122 号方案）：
  # 仓库里 17 个 Test*MySQL* 有 3 个是**假驱动**（自写 driver.Connector +
  # 手写 information_schema 回复），它们能断言「生成的 SQL 长什么样」，
  # 但证明不了「这条 SQL 服务器真的接受」。真库作业补的正是这一层。
  #
  # 四个必须做对的细节（写错都不报错，只静默失效）：
  #   ① 镜像钉 mariadb:11.4 —— 项目有 37 处 int(11) 显示宽度，MySQL 8.0.19
  #      起弃用它；MariaDB 完整保留，所以这里的结论才适用于目标库。
  #   ② 环境变量必须 MARIADB_* 前缀 —— 写成 MYSQL_* 时镜像照样启动，
  #      但库/用户不会被创建，表现为「连得上但库不存在」，极易误判成 DSN 写错。
  #   ③ 健康检查用 mariadb-admin（mysqladmin 是兼容软链，不留技术债）。
  #   ④ 覆盖率基线不动：本作业用不同的 -run 参数，混进汇总会让漂移检测失真
  #      （122 决策 8）。
  mariadb-integration:
    name: MariaDB 集成与 SQLite 迁移
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          # 漏掉 MARIADB_DATABASE 时镜像不会创建 MARIADB_USER，
          # 表现为 Access denied for user 'tiku'@'%'。
          MARIADB_DATABASE: tiku_ci
          MARIADB_USER: tiku
          MARIADB_PASSWORD: tiku
        ports:
          # GitHub Actions 的 service container 不走 docker network，
          # 必须显式映射到 localhost，否则 127.0.0.1:3306 连不上。
          - 3306:3306
        # options 里的引号不能省：折叠多行时不加引号，GHA 会把 ping / -uroot
        # 当独立参数传给容器，健康检查恒失败。
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # 唯一必须保留 MYSQL_ 前缀的地方：它不是容器变量，而是
      # tools/mysql_migration_common.py:resolve_password 读的应用侧变量名。
      # 改错的表现是工具弹出交互式密码提示 → 挂到超时。
      MYSQL_PASSWORD: tiku
      TIKU_TEST_MYSQL_DSN: "tiku:tiku@tcp(127.0.0.1:3306)/tiku_ci?charset=utf8mb4&parseTime=true&loc=Local"
      # 声明「本作业必须有真库」：internal/registry/mysql_test_helper_test.go 的
      # mysqlTestDSN 会据此把「DSN 缺失」判成配置错误（t.Fatal）而不是跳过，
      # 否则 workflow 少写一个 env 会让真库覆盖悄悄归零而 CI 全绿。
      TIKU_TEST_MYSQL_REQUIRED: "1"
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 配置 Go 环境
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # 用 setup-python 而不是系统 python3：ubuntu-24.04 的系统解释器带
      # PEP 668 的 externally-managed 标记，pip install 会被拒绝。
      - name: 配置 Python 环境
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: 安装 PyMySQL
        run: |
          python -m pip install --quiet PyMySQL
          python -c "import pymysql; print('PyMySQL', pymysql.__version__)"

      # 探测用 PyMySQL 而不是宿主机 mariadb-admin：runner 上不保证装了 MariaDB
      # 客户端，缺它的失败会被误读成「数据库没起来」。
      - name: 等待 MariaDB 就绪
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys, time
          import pymysql

          deadline = time.time() + 180
          last = None
          while time.time() < deadline:
              try:
                  conn = pymysql.connect(host="127.0.0.1", port=3306, user="tiku",
                                         password="tiku", database="tiku_ci",
                                         connect_timeout=5)
                  with conn.cursor() as cur:
                      cur.execute("SELECT VERSION(), DATABASE(), CURRENT_USER()")
                      print("MariaDB 已就绪：", cur.fetchone())
                  conn.close()
                  sys.exit(0)
              except Exception as exc:  # noqa: BLE001 - 就绪探测需要吞掉全部异常
                  last = exc
                  time.sleep(3)
          print("::error::MariaDB 未在 180 秒内就绪，最后一次错误：%r" % (last,))
          sys.exit(1)
          PY

      - name: 运行真实 MariaDB 迁移测试
        run: |
          set -euo pipefail
          # 不传 -short：mysqlTestDSN 用「CI + 非 short」判定本作业承诺了真库。
          # 传 -short 会让 DSN 缺失退化成跳过，即使 TIKU_TEST_MYSQL_REQUIRED 被人误删。
          go test -count=1 -p 1 -v ./internal/registry/... -run 'MariaDB|MySQL' 2>&1 | tee maria-test.log

      - name: 构造 SQLite 源库与种子数据
        env:
          TIKU_E2E_SQLITE_OUT: ${{ runner.temp }}/e2e-source.db
        run: |
          set -euo pipefail
          go test -count=1 -v ./internal/registry \
            -run 'TestMariaDBMigrationE2EPrepare|TestMariaDBMigrationE2ESourceIsReadable|TestMariaDBSourceSeedsCoverBoundaries' \
            2>&1 | tee maria-e2e-prepare.log
          test -s "$RUNNER_TEMP/e2e-source.db"

      # 前一步的真库测试会 DROP/CREATE 各种表，migrate 工具要求目标库为空库，
      # 所以必须显式清一遍。库名保持固定（便于排查），清理交给工具而不是换库名。
      - name: 清空目标库（migrate 要求空库）
        run: |
          set -euo pipefail
          python tools/mysql_clear.py \
            --mysql-host 127.0.0.1 --mysql-port 3306 \
            --mysql-user tiku --mysql-database tiku_ci \
            --backup-schema "$RUNNER_TEMP/schema-before-clear.sql" --yes

      - name: 执行 SQLite → MariaDB 迁移
        run: |
          set -euo pipefail
          python tools/migrate_sqlite_to_mysql.py \
            --sqlite-path "$RUNNER_TEMP/e2e-source.db" \
            --mysql-host 127.0.0.1 --mysql-port 3306 \
            --mysql-user tiku --mysql-database tiku_ci --yes 2>&1 | tee maria-migrate.log

      # 只跑 migrate 不跑 verify 等于只验「行数对得上」，验不出内容错：
      # verify 会逐行比对（≤50000 行）、按声明精度归一时间、校验 DECIMAL 定标。
      - name: 逐行校验迁移结果
        run: |
          set -euo pipefail
          python tools/verify_sqlite_mysql_migration.py \
            --sqlite-path "$RUNNER_TEMP/e2e-source.db" \
            --mysql-host 127.0.0.1 --mysql-port 3306 \
            --mysql-user tiku --mysql-database tiku_ci --json 2>&1 | tee maria-verify.log

      # 负面用例：没有这条，工具被改成「覆盖已有数据」也测不出来。
      # 两个判据缺一不可 —— 只看退出码会在「因为别的原因失败」时也算通过。
      - name: 断言「目标库非空必须被拒绝」
        run: |
          # ⚠️ 这里**必须显式 set +e**。
          #
          # GitHub Actions 用 `/usr/bin/bash -e {0}` 执行 run 步骤（日志里能看到
          # 这一行），那个 `-e` 是 **runner 注入的**，步骤内的 `set -uo pipefail`
          # 关不掉它。于是 `python ... > log` 返回 1 时 bash 立刻退出，
          # 后面的 `rc=$?` / `cat log` 根本不会执行 —— 表现就是：
          #   · 该 step 失败，但日志里只有脚本源码，没有 `cat` 的输出；
          #   · 真实原因（「目标数据库不是空库」）只躺在被重定向走的
          #     maria-second.log 里，只能从 artifact 里挖出来。
          #
          # 这不是猜测：本轮实测该 step 的失败日志确实只有源码行，
          # 而 artifact 里的 maria-second.log 内容完全正确
          # （`迁移失败：目标数据库不是空库，默认拒绝迁移以避免覆盖现有数据。`）。
          #
          # 结论：**「被测程序按预期返回非零」是断言的一部分，不是步骤失败**，
          # 必须用 set +e 把它的退出码捕获下来再自行判断。
          set +e
          python tools/migrate_sqlite_to_mysql.py \
            --sqlite-path "$RUNNER_TEMP/e2e-source.db" \
            --mysql-host 127.0.0.1 --mysql-port 3306 \
            --mysql-user tiku --mysql-database tiku_ci --yes > maria-second.log 2>&1
          rc=$?
          # 之后恢复宽松模式即可：下面的判断全部自己 exit，不依赖 -e。
          cat maria-second.log
          if [[ $rc -eq 0 ]]; then
            echo "::error::第二次迁移竟然成功：目标库非空必须被拒绝，否则工具会静默覆盖现有数据"
            exit 1
          fi
          if ! grep -q '目标数据库不是空库' maria-second.log; then
            echo "::error::失败原因不是「目标库非空」（退出码 $rc），实际输出见上"
            exit 1
          fi
          echo "✅ 目标库非空被正确拒绝（退出码 $rc）"

      # 迁移后的库行为观测：把「MariaDB 特有行为」变成可观测证据。
      # DSN 一旦指错库，前面所有断言仍会全绿，而结论与目标库无关。
      #
      # 注意这里**不断言 int(11)**：migrate 工具把 SQLite 的 INT 统一映射成
      # BIGINT（tools/migrate_sqlite_to_mysql.py:mysql_type），迁移产物里本就不该
      # 出现 int(11)。「显示宽度原样保留」是 GORM AutoMigrate 路径的属性，
      # 由下一步的 Go 真库测试断言 —— 放在这里会因为断言对象不存在而恒假。
      - name: 观测迁移后目标库的 MariaDB 行为
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import sys
          import pymysql

          conn = pymysql.connect(host="127.0.0.1", port=3306, user="tiku",
                                 password="tiku", database="tiku_ci")
          failures = []
          try:
              with conn.cursor() as cur:
                  cur.execute("SELECT VERSION()")
                  version = cur.fetchone()[0]
                  print("目标库版本：", version)
                  if "MariaDB" not in version:
                      failures.append("版本 %r 不含 MariaDB：本作业的结论只对 MariaDB 成立" % (version,))
                  match = re.match(r"(\d+)\.(\d+)\.(\d+)", version)
                  if not match:
                      failures.append("无法解析版本号 %r" % (version,))
                  else:
                      parsed = tuple(int(part) for part in match.groups())
                      print("解析后版本：", parsed)
                      if parsed < (10, 2, 2):
                          failures.append(
                              "MariaDB %s 低于迁移工具门槛 10.2.2（会走 767 字节索引上限分支）" % (parsed,))

                  cur.execute("SELECT @@innodb_page_size, @@character_set_database, @@collation_database")
                  page_size, charset, collation = cur.fetchone()
                  print("innodb_page_size=%s character_set_database=%s collation_database=%s"
                        % (page_size, charset, collation))
                  if str(charset).lower() != "utf8mb4":
                      failures.append("库字符集为 %r，want utf8mb4（四字节字符会被截断）" % (charset,))
                  if int(page_size) < 16384:
                      failures.append("innodb_page_size=%s 小于 16384：大索引前缀判定会走保守分支" % (page_size,))

                  cur.execute(
                      "SELECT COLUMN_NAME, COLUMN_TYPE FROM information_schema.COLUMNS "
                      "WHERE TABLE_SCHEMA = 'tiku_ci' AND TABLE_NAME = 'users' "
                      "AND COLUMN_NAME IN ('id', 'balance', 'gift_balance', 'parent_id') "
                      "ORDER BY COLUMN_NAME"
                  )
                  print("迁移后 users 关键列类型：", cur.fetchall())
                  cur.execute(
                      "SELECT COUNT(*) FROM information_schema.STATISTICS "
                      "WHERE TABLE_SCHEMA = 'tiku_ci' AND TABLE_NAME = 'blacklist_entries' "
                      "AND INDEX_NAME = 'uk_blacklist_entry_pattern'"
                  )
                  composite = cur.fetchone()[0]
                  print("blacklist_entries 唯一复合索引列数：", composite)
                  if composite != 3:
                      failures.append("uk_blacklist_entry_pattern 只有 %d 列，want 3" % (composite,))
          finally:
              conn.close()

          if failures:
              for item in failures:
                  print("::error::" + item)
              sys.exit(1)
          print("✅ 迁移产物运行在 MariaDB 11.x + utf8mb4 上")
          PY

      # 最后一步：把「真的在测 MariaDB」与「int(11) 显示宽度原样保留」变成
      # 可失败的断言，而不是靠人工看日志。
      #
      # 为什么用 Go 而不是 SQL：显示宽度是 GORM AutoMigrate 建表路径的属性，
      # 必须在真库上建出实体表才能观测。这一步会清库（mysqlTestFreshDB），
      # 所以刻意放在所有迁移/校验之后 —— 前面几步的证据已落日志与 artifact。
      - name: 断言确为 MariaDB 且 int(11) 显示宽度原样保留
        run: |
          set -euo pipefail
          go test -count=1 -v ./internal/registry \
            -run 'TestMariaDBServerIsActuallyMariaDB|TestMariaDBPreservesIntegerDisplayWidth' \
            2>&1 | tee maria-display-width.log

      - name: 上传 MariaDB 测试日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MariaDB集成日志-${{ github.sha }}
          path: |
            maria-test.log
            maria-e2e-prepare.log
            maria-migrate.log
            maria-verify.log
            maria-second.log
            maria-display-width.log
          if-no-files-found: warn
          retention-days: 14

  summary:
    name: 持续集成摘要
    runs-on: ubuntu-24.04
    needs: [backend, frontend, docker, python, release-build, probe-windows, mariadb-integration]
    if: always()
    steps:
      - name: 输出构建结果与产物链接
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          PROBE_WINDOWS_RESULT: ${{ needs.probe-windows.result }}
          RELEASE_BUILD_RESULT: ${{ needs.release-build.result }}
          MARIADB_RESULT: ${{ needs.mariadb-integration.result }}
          BACKEND_ARTIFACT_URL: ${{ needs.backend.outputs.artifact-url }}
          FRONTEND_ARTIFACT_URL: ${{ needs.frontend.outputs.artifact-url }}
          DOCKER_ARTIFACT_URL: ${{ needs.docker.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          {
            result_label() {
              case "$1" in
                success) echo "成功" ;;
                failure) echo "失败" ;;
                cancelled) echo "已取消" ;;
                skipped) echo "已跳过" ;;
                *) echo "未执行" ;;
              esac
            }

            echo '# 持续集成结果'
            echo
            echo '| 检查项目 | 结果 |'
            echo '| --- | --- |'
            printf '| Go 后端检查 | %s |\n' "$(result_label "$BACKEND_RESULT")"
            printf '| Python 工具测试 | %s |\n' "$(result_label "$PYTHON_RESULT")"
            printf '| build-exe.ps1 探测回归（PowerShell 5.1） | %s |\n' "$(result_label "$PROBE_WINDOWS_RESULT")"
            printf '| 跨平台发布构建 | %s |\n' "$(result_label "$RELEASE_BUILD_RESULT")"
            printf '| Vue 前端检查 | %s |\n' "$(result_label "$FRONTEND_RESULT")"
            printf '| Docker 镜像构建 | %s |\n' "$(result_label "$DOCKER_RESULT")"
            printf '| MariaDB 集成与 SQLite 迁移 | %s |\n' "$(result_label "$MARIADB_RESULT")"
            echo
            echo '## 构建产物'
            echo
            if [[ -n "$BACKEND_ARTIFACT_URL" ]]; then
              printf -- '- [下载后端构建产物](%s)\n' "$BACKEND_ARTIFACT_URL"
            else
              echo '- 后端构建产物未生成或上传失败。'
            fi
            if [[ -n "$FRONTEND_ARTIFACT_URL" ]]; then
              printf -- '- [下载前端构建产物](%s)\n' "$FRONTEND_ARTIFACT_URL"
            else
              echo '- 前端构建产物未生成或上传失败。'
            fi
            if [[ -n "$DOCKER_ARTIFACT_URL" ]]; then
              printf -- '- [下载 Docker 镜像归档](%s)（下载后可使用 docker load 导入）\n' "$DOCKER_ARTIFACT_URL"
            else
              echo '- Docker 镜像归档未生成或上传失败。'
            fi
            echo
            printf '[查看完整运行日志](%s)\n' "$RUN_URL"
            printf '\n代码提交：`%s`\n' "$COMMIT_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
