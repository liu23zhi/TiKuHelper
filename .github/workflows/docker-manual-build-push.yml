name: 手动构建并推送 Docker 镜像

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: tikuadapter-personal
  REGISTRY: docker.io
  REGISTRY_PREFIX: docker.io/${{ secrets.DOCKER_USERNAME }}
  DOCKER_FILE_PATH: Dockerfile

jobs:
  # 先造 exe，再构建镜像。
  #
  # 为什么必须在 CI 里造：tools/userexam-crypto/dist/* 被 .gitignore 排除，
  # checkout 后必然不存在；而 Dockerfile 的 WITH_USEREXAM_TOOL=1（默认）
  # 会在缺文件时 exit 1。若只在 Linux runner 上跑构建，这个 workflow 会
  # 永久失败 —— 而失败原因看起来像「Dockerfile 坏了」，实际是「拿不到 gitignore 的二进制」。
  #
  # exe 必须由 PyInstaller 在 Windows 上打包（64 位 CPython 3.11 + PyInstaller 6.x
  # + apsw 原生扩展），Linux 造不出来。
  build-userexam-exe:
    name: 构建 userexam-crypto.exe
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 配置 Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: 安装 apsw-sqlite3mc 原生运行时
        working-directory: tools/userexam-crypto
        shell: pwsh
        run: |
          # requirements.txt 已写死版本与目标目录（脚本的 _resource_root() 去 .\_vendor 找 .pyd）。
          py -3.11 -m pip install --disable-pip-version-check --target .\_vendor -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "apsw-sqlite3mc 安装失败（exit $LASTEXITCODE）" }
          $pyd = ".\_vendor\apsw\__init__.cp311-win_amd64.pyd"
          if (-not (Test-Path $pyd)) { throw "缺少原生扩展：$pyd" }
          Write-Host "apsw pyd = $((Get-Item $pyd).Length) bytes"

      - name: 构建单文件 userexam-crypto.exe
        working-directory: tools/userexam-crypto
        shell: pwsh
        run: |
          py -3.11 -m pip install --disable-pip-version-check "pyinstaller>=6,<7"
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller 安装失败（exit $LASTEXITCODE）" }
          # 必须用 powershell.exe 5.1：脚本 NOTES 说明 pwsh 7 会掩盖 -c 引号缺陷。
          $exe = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          & $exe -NoProfile -ExecutionPolicy Bypass -File .\build-exe.ps1
          if ($LASTEXITCODE -ne 0) { throw "build-exe.ps1 失败（exit $LASTEXITCODE）" }
          $out = ".\dist\userexam-crypto.exe"
          if (-not (Test-Path $out)) { throw "构建产物不存在：$out" }
          $size = (Get-Item $out).Length
          Write-Host "userexam-crypto.exe = $size bytes"
          if ($size -lt 5MB) { throw "产物仅 $size 字节，疑似不是单文件打包" }
          $head = [System.IO.File]::ReadAllBytes($out)[0..1]
          if ($head[0] -ne 0x4D -or $head[1] -ne 0x5A) { throw "产物不是 PE 文件（期望 MZ 头）" }

      - name: 上传 userexam-crypto.exe
        uses: actions/upload-artifact@v7
        with:
          name: userexam-crypto-exe
          path: tools/userexam-crypto/dist/userexam-crypto.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  build-and-push:
    needs: [build-userexam-exe]
    runs-on: ubuntu-latest

    steps:
      - name: 设置时区为 Asia/Shanghai
        run: sudo timedatectl set-timezone Asia/Shanghai

      - name: 拉取仓库代码
        uses: actions/checkout@v7
        with:
          submodules: true   # 拉取子模块
          fetch-depth: 0     # 保证能获取完整历史，避免浅克隆

      # 把 build-userexam-exe 产出的 exe 放到 Dockerfile 期望的位置。
      # 不下载的话，Dockerfile 的 WITH_USEREXAM_TOOL=1 分支会 exit 1。
      - name: 下载 userexam-crypto.exe
        uses: actions/download-artifact@v7
        with:
          name: userexam-crypto-exe
          path: tools/userexam-crypto/dist

      - name: 校验 exe 已就位
        shell: bash
        run: |
          set -euo pipefail
          f=tools/userexam-crypto/dist/userexam-crypto.exe
          if [[ ! -s "$f" ]]; then
            echo "::error title=缺产物::没有下载到 $f，docker build 会因此失败。"
            exit 1
          fi
          echo "userexam-crypto.exe = $(stat -c%s "$f") bytes"


      - name: 生成时间戳 TAG
        id: time
        run: |
          TAG=$(TZ='Asia/Shanghai' date +"%Y_%m_%d_%H_%M_%S")
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "生成的时间标签: $TAG"

      - name: 初始化 Buildx（container driver）
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: 登录 Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 恢复 GHA 构建缓存
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: Docker-image-build-latest
          restore-keys: |
            buildx-

      - name: 拉取 Registry 缓存镜像（如果存在）
        run: |
          CACHE_IMAGE="${{ env.REGISTRY_PREFIX }}/${{ env.IMAGE_NAME }}:cache"
          echo "尝试拉取缓存镜像: $CACHE_IMAGE"
          docker pull "$CACHE_IMAGE" || true

      - name: 拉取基础镜像
        run: |
          BASE_IMAGE=$(grep -i '^FROM ' ${{ env.DOCKER_FILE_PATH }} | head -n1 | awk '{print $2}')
          echo "基础镜像: $BASE_IMAGE"
          docker pull "$BASE_IMAGE" || true

      - name: 构建并推送镜像（使用 GHA + Registry 双缓存）
        id: build
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          file: ${{ env.DOCKER_FILE_PATH }}
          push: true

          tags: |
            ${{ env.REGISTRY_PREFIX }}/${{ env.IMAGE_NAME }}:${{ steps.time.outputs.tag }}
            ${{ env.REGISTRY_PREFIX }}/${{ env.IMAGE_NAME }}:latest

          cache-from: |
            type=local,src=/tmp/.buildx-cache
            type=registry,ref=${{ env.REGISTRY_PREFIX }}/${{ env.IMAGE_NAME }}:cache

          cache-to: |
            type=local,dest=/tmp/.buildx-cache,mode=max
            type=registry,ref=${{ env.REGISTRY_PREFIX }}/${{ env.IMAGE_NAME }}:cache,mode=max

      - name: 保存 GHA 构建缓存
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: Docker-image-build-latest

      # 关闭默认摘要后，单独保留可导入 Docker Desktop 的构建记录。
      - name: 导出 Docker 构建记录
        id: export_record
        if: always() && steps.build.outcome != 'skipped' && steps.build.outcome != ''
        continue-on-error: true
        run: docker buildx history export --finalize --all --output "$RUNNER_TEMP/docker-build-record.dockerbuild"

      - name: 上传 Docker 构建记录
        id: upload_record
        if: always() && steps.export_record.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: docker-build-${{ github.run_id }}-${{ github.run_attempt }}.dockerbuild
          path: ${{ runner.temp }}/docker-build-record.dockerbuild

      - name: 输出中文 Docker 构建摘要
        if: always()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          IMAGE_TAG: ${{ steps.time.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
          BUILD_RECORD_URL: ${{ steps.upload_record.outputs.artifact-url }}
        run: |
          case "$BUILD_OUTCOME" in
            success) BUILD_STATUS="成功（镜像已推送）" ;;
            failure) BUILD_STATUS="失败" ;;
            cancelled) BUILD_STATUS="已取消" ;;
            *) BUILD_STATUS="未执行" ;;
          esac

          IMAGE="${REGISTRY_PREFIX}/${IMAGE_NAME}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          {
            echo '## Docker 构建摘要'
            echo
            echo '| 项目 | 内容 |'
            echo '| --- | --- |'
            printf '| 构建结果 | %s |\n' "$BUILD_STATUS"
            printf '| 构建文件 | `%s` |\n' "$DOCKER_FILE_PATH"
            if [ -n "$IMAGE_TAG" ]; then
              printf '| 目标镜像标签 | `%s:%s` |\n' "$IMAGE" "$IMAGE_TAG"
            fi
            printf '| 最新镜像标签 | `%s:latest` |\n' "$IMAGE"
            printf '| 镜像摘要 | `%s` |\n' "${IMAGE_DIGEST:-未生成}"
            printf '| 镜像 ID | `%s` |\n' "${IMAGE_ID:-未生成}"
            printf '| 代码提交 | `%s` |\n' "$GITHUB_SHA"
            echo
            printf '[查看构建日志](%s)\n' "$RUN_URL"
            if [ -n "$BUILD_RECORD_URL" ]; then
              echo
              printf '[下载构建记录（可导入 Docker Desktop）](%s)\n' "$BUILD_RECORD_URL"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
