# JWT_SECRET 环境变量优先；未配置时复用/生成数据库中的签名密钥。
# 反向代理部署可通过 TRUSTED_PROXIES 配置可信代理网段。
limit:
  enable: true
  duration: 60 # 时间窗口为60秒
  requests: 120 # 每个来源IP在窗口内最多120个请求
jwtSecret: "" # 可选，至少32字节；JWT_SECRET 环境变量优先
mysql: "" # MySQL DSN；SQL_DSN 环境变量优先，两者都填时以环境变量为准
database:
  path: "" # SQLite数据库文件路径，留空默认为 tiku.db（向后兼容），Docker部署建议设置为 data/tiku.db
  mysqlPool:
    maxOpenConns: 32 # MySQL最大打开连接数；同时作为优先级调度器并发上限
    maxIdleConns: 8 # MySQL最大空闲连接数
    connMaxLifetimeSeconds: 1800 # MySQL连接最长存活时间
    connMaxIdleTimeSeconds: 300 # MySQL连接最大空闲时间
api:
  - name: '样例接口 json 请求'
    enable: false
    url: http://lyck6.cn/scriptService/api/autoFreeAnswer
    method: POST
    headers:
      - key: Content-Type
        value: application/json
    body: '{"question":"${question}"}'
    answer: 'result.answers.0.0'

  - name: '样例接口 表单请求'
    enable: false
    url: https://cx.icodef.com/wyn-nb?v=4
    method: POST
    headers:
      - key: Content-Type
        value: application/x-www-form-urlencoded
    body: 'question=${question}'
    answer: 'data'
elasticsearch:
  url: http://127.0.0.1:9200
recordEmptyAnswer: false # 是否记录空答案（开启之后即便没有答案也会记录在数据库方便后期手动整理题库）
