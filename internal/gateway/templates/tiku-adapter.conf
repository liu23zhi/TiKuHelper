# Embedded http-context configuration for the container gateway.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

map $uri $tiku_log_path {
    default "[public-entry]";
    ~^/(api|adapter-service)/ $uri;
}
log_format tiku_safe '$remote_addr [$time_local] "$request_method $tiku_log_path $server_protocol" $status $body_bytes_sent $request_time';

# Consent audit must never use legacy realip trust. realip_remote_addr
# is the actual peer before recursive rewriting. A configured edge may attest
# ONE address; a chain falls back to the actual edge. Go validates the literal.
map $http_x_forwarded_for $tiku_agreement_edge_ip {
    default $realip_remote_addr;
    ~^[0-9A-Fa-f:.]+$ $http_x_forwarded_for;
}
map "$tiku_trusted_proto:$uri" $tiku_route_xff {
    default $remote_addr;
    ~^0:/api/(admin/)?agreements/ $realip_remote_addr;
    ~^1:/api/(admin/)?agreements/ $tiku_agreement_edge_ip;
}
map $uri $tiku_agreement_forwarded {
    default "";
    ~^/api/(admin/)?agreements/ "by=_tiku_agreement_gateway";
    ~^/api/extension-logs/(receipt-policy|batches)$ "by=_tiku_agreement_gateway";
}

upstream tiku_adapter {
    server 127.0.0.1:8061;
    keepalive 32;
}
