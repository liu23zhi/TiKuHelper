# Embedded http-context configuration for the container gateway.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

map $uri $tiku_log_path {
    default "[public-entry]";
    ~^/(api|adapter-service)/ $uri;
}
log_format tiku_safe '$remote_addr [$time_local] "$request_method $tiku_log_path $server_protocol" $status $body_bytes_sent $request_time';

upstream tiku_adapter {
    server 127.0.0.1:8061;
    keepalive 32;
}
