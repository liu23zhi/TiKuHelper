# 可选：主站及可信别名，填写精确主机名，不使用通配符或路径。配置脚本泛域时自动保留该域下的 tiku 主机。
# 无托管子域的单站（含历史纯路径部署）可留空；配置主站或启用泛域后严格隔离未知 Host。修改此项后重启。
siteHosts: []
# jwtSecret 可选：至少 32 个 UTF-8 字节，没有最大长度或字符集限制，可使用特殊符号；
# 首尾空白会裁剪。未配置时复用/生成数据库中的签名密钥。
# 直接运行服务时 JWT_SECRET 环境变量优先；Compose 部署固定为空，不读取宿主环境插值。
# 反向代理部署可通过 TRUSTED_PROXIES 或 trusted_proxies.txt 配置可信代理网段。
limit:
  enable: true
  duration: 60
  requests: 120
jwtSecret: "" # 可选，至少32个UTF-8字节；无最大长度/字符集限制
mysql: ""
database:
  path: "data/tiku.db"
api:
  - name: '样例接口 json 请求'
    enable: false
    url: http://lyck6.cn/scriptService/api/autoFreeAnswer
    method: POST
    headers:
      - key: Content-Type
        value: application/json
    body: '{"question":"${question}"}'
    answer: 'result.answers.0.0'

  - name: '样例接口 表单请求'
    enable: false
    url: https://cx.icodef.com/wyn-nb?v=4
    method: POST
    headers:
      - key: Content-Type
        value: application/x-www-form-urlencoded
    body: 'question=${question}'
    answer: 'data'
elasticsearch:
  url: http://127.0.0.1:9200
recordEmptyAnswer: false
