# 必须通过 JWT_SECRET 环境变量提供至少 32 字节随机密钥。
# 跨域浏览器调用可通过 CORS_ALLOWED_ORIGINS 配置逗号分隔的白名单。
# 反向代理部署可通过 TRUSTED_PROXIES 配置可信代理网段。
limit:
  enable: true
  duration: 60
  requests: 120
jwtSecret: "" # 必填，至少32字节；推荐通过 JWT_SECRET 环境变量注入
mysql: ""
database:
  path: "data/tiku.db"
api:
  - name: '样例接口 json 请求'
    enable: false
    url: http://lyck6.cn/scriptService/api/autoFreeAnswer
    method: POST
    headers:
      - key: Content-Type
        value: application/json
    body: '{"question":"${question}"}'
    answer: 'result.answers.0.0'

  - name: '样例接口 表单请求'
    enable: false
    url: https://cx.icodef.com/wyn-nb?v=4
    method: POST
    headers:
      - key: Content-Type
        value: application/x-www-form-urlencoded
    body: 'question=${question}'
    answer: 'data'
elasticsearch:
  url: http://127.0.0.1:9200
recordEmptyAnswer: false
