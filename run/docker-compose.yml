# tiku-adapter + nginx 反向代理（含 WebSocket 透传修复）。
#
# 用法：
#   1) 先把证书放进 ./nginx/ssl（fullchain.pem / privkey.key），
#      扫码图放进 ./nginx/html（可选，对应 /api/Wechat_qc_code）。
#   2) docker compose up -d --build
#   3) 浏览器访问 http://<主机>:8680 或 https://<主机>:9043 即可；
#      nginx 通过 compose 网络以服务名 tiku-adapter:8060 访问后端，
#      因此 8060 不再需要对外发布（见下面的 ports 说明）。

services:
  tiku-adapter:
    # image: tiku-adapter
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: tiku-adapter
    restart: unless-stopped
    ports:
      # 只绑本机回环：容器间由 nginx 通过 compose 网络访问，无需对外暴露。
      # 需要从别的机器直连调试时改成 "8060:8060"，但要知道：
      # 直接打 8060 时任何人都能伪造 X-Forwarded-For（应用默认信任所有来源的转发头）。
      - "127.0.0.1:8060:8060"
    environment:
      JWT_SECRET: "${JWT_SECRET:-}"
      # 管理员初始化密码：默认注释掉（不设置时首次启动使用 123456，请登录后立即修改）。
      # 需要固定初始化密码时，取消下一行注释并改成自己的强密码。这个文件只是示例。
      # TIKU_ADMIN_PASSWORD: "请改成你自己的强密码"
      # 可信代理：留空（含只有注释的 trusted_proxies.txt）= 信任所有来源的 X-Forwarded-For；
      # 填写逗号分隔的 IP/CIDR = 只信任列出的来源（局域网与本地地址始终默认信任）。
      # 只有 nginx 能访问后端时留空即可；想收紧就填 nginx 容器 IP 或 compose 网段。
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      # 固定时区，避免访问日志/GORM 时间变成 UTC。
      TZ: Asia/Shanghai
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml:ro
      # 可信代理文件（留空或只有注释 = 信任所有来源）。也可用 TRUSTED_PROXIES 环境变量指定。
      - ./trusted_proxies.txt:/app/trusted_proxies.txt:ro

  nginx:
    image: nginx:alpine
    container_name: tiku-nginx
    restart: unless-stopped
    depends_on:
      - tiku-adapter
    ports:
      - "8680:8680"   # HTTP
      - "9043:9043"   # HTTPS（证书见 ./nginx/ssl）
    volumes:
      # 配置：conf.d/tiku-adapter.conf（server + upstream + WS map）
      #       conf.d/tiku-proxy.inc（两个 server 共用的代理参数）
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/logs:/var/log/nginx
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

# 注意：nginx 在启动时会解析 upstream 里的服务器名，如果 tiku-adapter 还没创建，
# nginx 会以 "host not found in upstream" 退出；restart: unless-stopped 会让它自动重试，
# 等后端容器起来后即可正常。
