# 单容器运行 Nginx 与 Go；不需要独立 Nginx 服务。
# 证书可选：没有有效证书时保留 HTTP，证书到位后自动启用 HTTPS。
name: tikuhelper

services:
  tikuhelper:
    image: tikuhelper:local
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: tikuhelper
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:8060:8060"
      - "8680:8680"
      - "9043:9043"
    environment:
      TIKU_APP_MODE: "${TIKU_APP_MODE:-production}"
      JWT_SECRET: "${JWT_SECRET:-}"
      # 留空默认 123456；公共初始化口令只能通过容器内 CLI 修改后用于登录。
      TIKU_ADMIN_PASSWORD: "${TIKU_ADMIN_PASSWORD:-}"
      # 保留现有客户端 IP 语义：空或 none 读取所有来源 XFF；具体列表补入本地/私网段。
      # HTTPS 协议头只信任显式列出的上游；Nginx 直接 TLS 请求始终识别为 HTTPS。
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      # TRUSTED_PROXIES 留空且明确选择文件时读取；仅挂载文件不会自动启用。
      TRUSTED_PROXIES_FILE: "${TRUSTED_PROXIES_FILE:-}"
      TZ: Asia/Shanghai
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml:ro
      - ./trusted_proxies.txt:/app/trusted_proxies.txt:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "/app/container-gateway", "--healthcheck"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3
