# 单容器运行 Nginx 与 Go；不需要独立 Nginx 服务。
#
# 网关进程是容器 PID 1：Go 只监听容器内的 127.0.0.1:8061，Nginx 对外
# 提供 8060/8680/9043。任一子进程异常退出都会结束容器，由 restart 策略恢复。
# 证书可选：没有有效证书时保留 HTTP，9043 不监听；证书到位后自动启用 HTTPS。
#
# 从旧版「Go + 独立 Nginx」升级时，先执行：
#   docker compose up -d --build --remove-orphans
# --remove-orphans 会移除旧的 tikuhelper-nginx 容器，避免它继续占用 8680/9043。
name: tikuhelper

services:
  tikuhelper:
    image: tikuhelper:local
    # 从当前仓库根目录构建；执行 compose 命令时仍应位于 run/ 目录。
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: tikuhelper
    restart: unless-stopped
    # 网关停止时先等待 Nginx 和 Go 排空请求，再结束容器。
    stop_grace_period: 30s
    ports:
      # 兼容本机直接访问 API；只绑定回环地址，不暴露给局域网。
      - "127.0.0.1:8060:8060"
      # HTTP 公网入口。脚本地址仍由服务端按 HTTPS 生成。
      - "8680:8680"
      # HTTPS 公网入口。仅在证书目录存在有效证书时实际监听。
      - "9043:9043"
    environment:
      # 可选值只有 production / development；空值按 production 处理。
      # Compose 不读取宿主环境，需要开发模式时直接把本行改为 "development"。
      TIKU_APP_MODE: ""
      # 可选；空值由服务端生成并持久化随机 JWT 密钥。
      # 手动填写时至少 32 个 UTF-8 字节，没有最大长度或字符集限制，可使用特殊符号。
      # 首尾空白会被裁剪，YAML 特殊字符请保留引号；更换值会使旧 JWT 失效。
      JWT_SECRET: ""
      # 可选；空值使用本地初始化口令 123456。该公共口令不能直接登录 Web 管理员账号。
      # 手动填写时最多 72 个 UTF-8 字节，可使用特殊符号；生产模式建议至少 8 个字符并含
      # 大写、小写、数字、特殊字符。不符合强度时记录警告但仍启动，已有密码不会被重置。
      TIKU_ADMIN_PASSWORD: ""
      # 可选；非空时优先使用逗号分隔的 IP/CIDR（也支持项目现有地址段写法）。
      # 空值或 none 表示信任所有来源的 X-Forwarded-For；具体列表会额外补入本地/私网段。
      # HTTPS 协议头只信任显式列出的上游；Nginx 直接 TLS 请求始终识别为 HTTPS。
      TRUSTED_PROXIES: ""
      # 可选文件路径；空值仍尝试读取 /app/trusted_proxies.txt（工作目录默认路径）。
      # 默认文件不存在或为空且 TRUSTED_PROXIES 为空时信任所有；明确填写的文件路径不存在，或文件含无效条目，则启动失败。
      # 需要使用其它文件时直接填写容器内路径，不从宿主环境插值读取。
      TRUSTED_PROXIES_FILE: ""
      # 固定上海时区，不通过宿主环境覆盖；修改后需重建/重启容器才会生效。
      TZ: Asia/Shanghai
    volumes:
      # 持久化 SQLite 数据库、上传内容、扩展缓存和系统设置；升级时不要加 -v。
      - ./data:/app/data
      # 应用日志与 Nginx 访问日志分别写入宿主机，便于排障和备份。
      - ./logs:/app/logs
      # 运行配置只读挂载；修改后按 README 说明重启或等待网关热加载。
      - ./config.yaml:/app/config.yaml:ro
      # 代理来源名单只读挂载；TRUSTED_PROXIES_FILE 为空时也会按默认路径主动读取。
      - ./trusted_proxies.txt:/app/trusted_proxies.txt:ro
      # 可选 Nginx 扩展配置只读挂载；基础配置始终来自镜像内置模板。
      # 冲突或语法错误的单个文件会被记录并跳过，不影响基础入口。
      - ./nginx-extra:/app/nginx-extra:ro
      # 证书目录只读挂载，支持多个 PEM 证书/私钥，按 SAN 和公钥自动配对。
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # 可选扫码图片等静态文件；没有文件时对应接口按应用逻辑返回。
      - ./nginx/html:/usr/share/nginx/html:ro
      # 可选预置二维码；仅普通站由 Go 按原始 Host 校验后返回；缺失或目录时返回 404。
      - ./Wechat_qc_code.jpg:/usr/share/nginx/html/Wechat_qc_code.jpg:ro
      # Nginx 访问日志目录；证书、私钥和日志不会被打进镜像。
      - ./nginx/logs:/var/log/nginx
    healthcheck:
      # 同时检查 Nginx 配置、Go /readyz 和经 Nginx 转发的 /readyz。
      test: ["CMD", "/app/container-gateway", "--healthcheck"]
      # 启动期间给数据库初始化和网关首轮证书扫描留出时间。
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3
