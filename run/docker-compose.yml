services:
  tiku-adapter:
    # image: tiku-adapter
    build: 
      context: ..
      dockerfile: Dockerfile
    container_name: tiku-adapter
    restart: unless-stopped
    ports:
      - "8060:8060"
    environment:
      JWT_SECRET: "${JWT_SECRET:-}"
      TIKU_ADMIN_PASSWORD: "${TIKU_ADMIN_PASSWORD:-}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-https://*.chaoxing.com}"
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
