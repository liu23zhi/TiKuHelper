# tiku-adapter + nginx 反向代理（含 WebSocket 透传修复）。
#
# 用法：
#   1) 先把证书放进 ./nginx/ssl（fullchain.pem / privkey.key），
#      扫码图放进 ./nginx/html（可选，对应 /api/Wechat_qc_code）。
#   2) docker compose up -d --build
#   3) 浏览器访问 http://<主机>:8680 或 https://<主机>:9043 即可；
#      nginx 通过 compose 网络以服务名 tiku-adapter:8060 访问后端，
#      因此 8060 不再需要对外发布（见下面的 ports 说明）。

services:
  tiku-adapter:
    # image: tiku-adapter
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: tiku-adapter
    restart: unless-stopped
    ports:
      # 只绑本机回环：容器间由 nginx 通过 compose 网络访问，无需对外暴露。
      # 需要从别的机器直连调试时改成 "8060:8060"，但要知道：
      # 直接打 8060 时任何人都能伪造 X-Forwarded-For（应用默认信任所有来源的转发头）。
      - "127.0.0.1:8060:8060"
    environment:
      JWT_SECRET: "${JWT_SECRET:-}"
      # 管理员初始化密码：默认注释掉（不设置时首次启动使用 123456，请登录后立即修改）。
      # 需要固定初始化密码时，取消下一行注释并改成自己的强密码。这个文件只是示例。
      # TIKU_ADMIN_PASSWORD: "请改成你自己的强密码"
      # 应用侧 TRUSTED_PROXIES 仅用于不经过 Nginx 的受控部署；Nginx 会清洗转发头。
      # 空配置（且没有额外挂载可信代理文件）= 信任所有来源的 X-Forwarded-For；
      # 默认 nginx 重建转发头，后端仅发布到宿主回环；本机/同网络调用方仍须可信。
      # 扩展设置默认由管理后台保存到数据库；不要在这里注入空的 EXTENSION_* 占位变量。
      # 显式设置的字段由环境变量优先覆盖，未设置的字段才读取数据库。
      # 固定时区，避免访问日志/GORM 时间变成 UTC。
      TZ: Asia/Shanghai
    volumes:
      # 扩展 CRX 与元数据默认缓存于 /app/data/extensions，即宿主 ./data/extensions。
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml:ro

  ticket-notification-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: tiku-ticket-notification-worker
    restart: unless-stopped
    entrypoint: ["/app/ticket-notification-worker"]
    command: ["-log-dir", "/app/logs/ticket-worker"]
    depends_on:
      - tiku-adapter
    environment:
      JWT_SECRET: "${JWT_SECRET:-}"
      TZ: Asia/Shanghai
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml:ro

  nginx:
    image: nginx:alpine
    container_name: tiku-nginx
    restart: unless-stopped
    depends_on:
      - tiku-adapter
    ports:
      - "8680:8680"   # HTTP
      - "9043:9043"   # HTTPS（证书见 ./nginx/ssl）
    volumes:
      # 配置：conf.d/tiku-adapter.conf（server + upstream + WS map）
      #       conf.d/tiku-proxy.inc（两个 server 共用的代理参数）
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # 保留原格式输入，由启动脚本转换为 Nginx realip 指令。
      - ./trusted_proxies.txt:/app/trusted_proxies.txt:ro
      - ./nginx/trusted-proxies-convert.sh:/app/trusted-proxies-convert.sh:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/logs:/var/log/nginx
    environment:
      TZ: Asia/Shanghai
    command:
      - /bin/sh
      - -c
      - >-
        sed 's/\r$//' /app/trusted-proxies-convert.sh > /tmp/trusted-proxies-convert.sh
        && /bin/sh /tmp/trusted-proxies-convert.sh /app/trusted_proxies.txt /tmp/trusted-proxies.generated.conf
        && exec nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

# 注意：nginx 在启动时会解析 upstream 里的服务器名，如果 tiku-adapter 还没创建，
# nginx 会以 "host not found in upstream" 退出；restart: unless-stopped 会让它自动重试，
# 等后端容器起来后即可正常。
