# tiku-adapter + nginx 反向代理（含 WebSocket 透传修复）。
#
# 用法：
#   1) 先把证书放进 ./nginx/ssl（fullchain.pem / privkey.key），
#      扫码图放进 ./nginx/html（可选，对应 /api/Wechat_qc_code）。
#   2) 生产新建/空凭据管理员先设置 TIKU_ADMIN_PASSWORD；已有凭据不会被该变量重置。
#      同时显式设置 TRUSTED_PROXIES=none 或实际 nginx IP/CIDR；也可显式选择
#      TRUSTED_PROXIES_FILE=/app/trusted_proxies.txt（TRUSTED_PROXIES 留空时使用）。
#   3) docker compose up -d --build
#   4) 浏览器访问 http://<主机>:8680 或 https://<主机>:9043 即可；
#      nginx 通过 compose 网络以服务名 tikuhelper:8060 访问后端，
#      因此 8060 不再需要对外发布（见下面的 ports 说明）。

name: tikuhelper

services:
  tikuhelper:
    image: tikuhelper:local
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: tikuhelper
    restart: unless-stopped
    ports:
      # 只绑本机回环：容器间由 nginx 通过 compose 网络访问，无需对外暴露。
      # 需要从别的机器直连调试时改成 "8060:8060"，但要知道：
      # 仍须正确配置可信代理；生产默认不会隐式信任所有来源或局域网。
      - "127.0.0.1:8060:8060"
    environment:
      TIKU_APP_MODE: "${TIKU_APP_MODE:-production}"
      JWT_SECRET: "${JWT_SECRET:-}"
      # 生产新建/空凭据管理员须强密码：至少8字符且大写/小写/数字/特殊字符齐全，UTF-8不超过72字节。
      # 已有有效凭据不要求该变量，也不会被其重置；是否需初始化由后端判定。
      TIKU_ADMIN_PASSWORD: "${TIKU_ADMIN_PASSWORD:-}"
      # 生产须显式选 none（不信任转发头）或实际受限 IP/CIDR；不补入本机/私网默认段。
      # 空/非法/合并覆盖整个地址族的列表会拒绝启动，不是信任所有来源。
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      # 仅在上项留空时使用显式文件；空/仅注释文件无效，文件须写 none 或受限 IP/CIDR。
      TRUSTED_PROXIES_FILE: "${TRUSTED_PROXIES_FILE:-}"
      # 扩展设置默认由后台数据库管理；仅显式配置的 EXTENSION_* 环境变量覆盖对应字段。
      # 隔离开发预览必须显式禁用扩展更新及工单提醒，不能依赖无网络路由。
      # 固定时区，避免访问日志/GORM 时间变成 UTC。
      TZ: Asia/Shanghai
    volumes:
      # 扩展 CRX 与元数据默认缓存于 /app/data/extensions，即宿主 ./data/extensions。
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml:ro
      # 仅挂载不自动启用：选择此文件时须显式设置 TRUSTED_PROXIES_FILE=/app/trusted_proxies.txt。
      - ./trusted_proxies.txt:/app/trusted_proxies.txt:ro

  nginx:
    image: nginx:alpine
    container_name: tikuhelper-nginx
    restart: unless-stopped
    depends_on:
      - tikuhelper
    ports:
      - "8680:8680"   # HTTP
      - "9043:9043"   # HTTPS（证书见 ./nginx/ssl）
    volumes:
      # 配置：conf.d/tiku-adapter.conf（server + upstream + WS map）
      #       conf.d/tiku-proxy.inc（两个 server 共用的代理参数）
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # 保留原格式输入，由启动脚本转换为 Nginx realip 指令。
      - ./trusted_proxies.txt:/app/trusted_proxies.txt:ro
      - ./nginx/trusted-proxies-convert.sh:/app/trusted-proxies-convert.sh:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/logs:/var/log/nginx
    environment:
      TZ: Asia/Shanghai
    command:
      - /bin/sh
      - -c
      - >-
        set -e;
        sed 's/\r$//' /app/trusted-proxies-convert.sh > /tmp/trusted-proxies-convert.sh;
        sh /tmp/trusted-proxies-convert.sh /app/trusted_proxies.txt /tmp/trusted-proxies.generated.conf;
        nginx -g 'daemon off;' &
        sleep 2;
        last='';
        while true; do
        cur=$(sha256sum /etc/nginx/conf.d/*.conf /etc/nginx/conf.d/*.inc /app/trusted_proxies.txt /app/trusted-proxies-convert.sh 2>/dev/null | sha256sum | cut -d' ' -f1);
        if [ -n "$$last" ] && [ "$$cur" != "$$last" ]; then
        sed 's/\r$//' /app/trusted-proxies-convert.sh > /tmp/trusted-proxies-convert.sh;
        sh /tmp/trusted-proxies-convert.sh /app/trusted_proxies.txt /tmp/trusted-proxies.generated.conf.next 2>/dev/null || true;
        if [ -s /tmp/trusted-proxies.generated.conf.next ]; then cp /tmp/trusted-proxies.generated.conf.next /tmp/trusted-proxies.generated.conf; fi;
        if nginx -t 2>&1; then nginx -s reload && echo 'reloaded: config changed'; else echo 'reload skipped: nginx -t failed'; fi;
        fi;
        last="$$cur";
        sleep 3;
        done
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

# 注意：nginx 在启动时会解析 upstream 里的服务器名，如果 tiku-adapter 还没创建，
# nginx 会以 "host not found in upstream" 退出；restart: unless-stopped 会让它自动重试，
# 等后端容器起来后即可正常。
