# tiku-adapter 反向代理配置。
#
# 放在 nginx 容器的 /etc/nginx/conf.d/ 下即可（官方镜像的默认 nginx.conf 会自动 include
# 该目录里的 *.conf）。两个 server 段共用的代理参数抽到同目录的 tiku-proxy.inc，
# 避免出现「只改了 8680、漏了 9043」这类问题（线上正是两处各写一份）。
#
# ⚠️ WebSocket 必须显式透传 Upgrade / Connection 两个头。
#    之前的配置写成 `proxy_set_header Connection "";` 且完全没有 Upgrade，
#    nginx 又不转发 hop-by-hop 的 Upgrade 头 → 后端收到的是普通 GET，
#    /adapter-service/public/wechat-login/ws 100% 返回 400 Bad Request，
#    扫码登录只能退化成轮询、永远连不上实时通道（实测 35/35 次全 400）。
#    这里的 map 让两类请求各取所需：
#      · 普通 HTTP 请求 → Connection 为空，upstream keepalive 的连接复用才有效
#      · WebSocket 升级 → Connection: upgrade，配合 Upgrade 头完成 101 握手
#    ⚠️ 不要把它改成写死的 `Connection "upgrade"`：那会让普通请求也无法复用连接，
#       upstream 里的 keepalive 32 就白设了。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream tiku_adapter {
    server tikuhelper:8060;
    keepalive 32;
}

# 若 nginx 前还有 CDN/负载均衡，在此 http 上下文按真实上游 IP/CIDR 配置信任，
# 并保证该上游已正确生成/追加 XFF；不要把所有互联网来源设为可信。
# set_real_ip_from 192.0.2.10;
# real_ip_header X-Forwarded-For;
# real_ip_recursive on;
# real_ip 模块先还原 $remote_addr，tiku-proxy.inc 再向后端发送单个已确认客户端 IP。
# https://nginx.org/en/docs/http/ngx_http_realip_module.html

# The startup converter preserves the application file syntax and writes only
# valid set_real_ip_from directives to this generated include.
include /tmp/trusted-proxies.generated.conf;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 8680;
    server_name _;
    client_header_timeout 3600s;
    client_body_timeout 3600s;
    send_timeout 3600s;
    keepalive_timeout 3600s;

    # 扫码登录用的静态图（按需保留；不需要可以删掉这个 location）
    location = /api/Wechat_qc_code {
        alias /usr/share/nginx/html/Wechat_qc_code.jpg;
        default_type image/jpeg;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://tiku_adapter;
        include /etc/nginx/conf.d/tiku-proxy.inc;
    }
}

server {
    listen 9043 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    client_header_timeout 3600s;
    client_body_timeout 3600s;
    send_timeout 3600s;
    keepalive_timeout 3600s;

    location = /api/Wechat_qc_code {
        alias /usr/share/nginx/html/Wechat_qc_code.jpg;
        default_type image/jpeg;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://tiku_adapter;
        include /etc/nginx/conf.d/tiku-proxy.inc;
    }
}
